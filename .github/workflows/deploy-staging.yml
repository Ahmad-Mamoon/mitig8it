# Somewhere to try a change before the only environment there is.
#
# Successful CI for a push to `staging` deploys all four services plus the frontend to
# their -staging counterparts. Nothing here creates cloud resources: the secrets, the Neon branch, the
# staging GitHub App and the Firebase site are one-time owner steps, written down in
# docs/deployment/staging.md. A deploy against a missing secret fails loudly rather
# than falling back to production.
#
# The order matters. The API revision carries the authenticated clients and lands
# before either server begins enforcing the matching credential. The frontend goes
# last, after an application-level dependency smoke proves both gRPC boundaries.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            echo 'ref=${{ github.event.workflow_run.head_sha }}' >> "$GITHUB_OUTPUT"
          else
            echo 'ref=${{ github.sha }}' >> "$GITHUB_OUTPUT"
          fi

  api-service:
    needs: authorize
    uses: ./.github/workflows/deploy-api-cloudrun.yml
    with:
      environment: staging
      # Staging exists to catch mistakes, not to serve traffic. Nothing is kept warm,
      # so an idle staging environment costs nothing.
      api_min_instances: '0'
      ref: ${{ needs.authorize.outputs.ref }}
    secrets: inherit

  github-service:
    needs: [authorize, api-service]
    uses: ./.github/workflows/deploy-github-cloudrun.yml
    with:
      environment: staging
      ref: ${{ needs.authorize.outputs.ref }}
    secrets: inherit

  analysis-service:
    needs: [authorize, api-service]
    uses: ./.github/workflows/deploy-analysis-cloudrun.yml
    with:
      environment: staging
      ref: ${{ needs.authorize.outputs.ref }}
    secrets: inherit

  remediation-service:
    needs: [authorize, api-service]
    uses: ./.github/workflows/deploy-remediation-cloudrun.yml
    with:
      environment: staging
      sandbox_driver: cloud_run_job
      ref: ${{ needs.authorize.outputs.ref }}
    secrets: inherit

  internal-grpc-smoke:
    needs: [github-service, analysis-service]
    uses: ./.github/workflows/smoke-internal-grpc.yml
    with:
      environment: staging
    secrets: inherit

  frontend:
    needs: [authorize, internal-grpc-smoke, remediation-service]
    uses: ./.github/workflows/deploy-frontend-firebase.yml
    with:
      environment: staging
      ref: ${{ needs.authorize.outputs.ref }}
    secrets: inherit
